<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هانی‌مون | منو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --coffee-900:#2B1B12; --coffee-700:#4A3221; --cream:#F2E8DC; --paper:#FAF6F0;
    --amber:#C08552; --olive:#6B7654; --line: rgba(43,27,18,0.16);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{margin:0;padding:0;}
  body{ background: var(--paper); color: var(--coffee-900); font-family:'Vazirmatn',sans-serif; -webkit-font-smoothing:antialiased; padding-bottom: 90px; }

  .hero{ background: var(--coffee-900); color: var(--cream); padding: 56px 24px 44px; text-align:center; position:relative; overflow:hidden; }
  .hero::before{ content:""; position:absolute; inset:0; background: radial-gradient(circle at 15% 20%, rgba(192,133,82,0.18), transparent 40%), radial-gradient(circle at 85% 75%, rgba(107,118,84,0.16), transparent 45%); pointer-events:none; }
  .hero-inner{ position:relative; max-width:640px; margin:0 auto; }
  .hero-mark{ width:46px; height:2px; background:var(--amber); margin:0 auto 22px; }
  .hero h1{ font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight:800; margin:0 0 10px; letter-spacing:-0.01em; }
  .hero p{ font-size:1.05rem; color:rgba(242,232,220,0.75); margin:0; line-height:1.7; }

  .cat-nav{ display:flex; gap:6px; overflow-x:auto; padding:14px 20px; background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top: env(safe-area-inset-top, 0px); z-index:10; -webkit-overflow-scrolling:touch; }
  .cat-nav::-webkit-scrollbar{ display:none; }
  .cat-nav a{ flex:0 0 auto; padding:8px 16px; font-size:0.88rem; font-weight:600; color:var(--coffee-700); text-decoration:none; border:1px solid var(--line); border-radius:999px; white-space:nowrap; transition: background .15s, color .15s, border-color .15s; }
  .cat-nav a:hover{ background:var(--coffee-900); color:var(--cream); border-color:var(--coffee-900); }

  main{ max-width:640px; margin:0 auto; padding:20px 24px 40px; }
  section.category{ margin-top:46px; scroll-margin-top:76px; }
  section.category:first-child{ margin-top:30px; }
  .cat-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; border-bottom:2px solid var(--coffee-900); padding-bottom:10px; }
  .cat-head h2{ font-size:1.5rem; font-weight:700; margin:0; }
  .cat-head span{ font-size:0.82rem; color:var(--olive); font-weight:600; }

  .item{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:16px 0; border-bottom:1px dashed var(--line); }
  .item:last-child{ border-bottom:none; }
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:1.05rem; font-weight:600; margin:0 0 4px; color:var(--coffee-900); }
  .item-desc{ font-size:0.88rem; color:#6b5c4e; margin:0 0 6px; line-height:1.6; max-width:46ch; }
  .item-price{ font-size:0.92rem; font-weight:700; color:var(--amber); }
  .item-price small{ font-size:0.68rem; font-weight:500; color:#9a8a7c; margin-right:3px; }

  .item-right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:0 0 auto; }
  .stepper{ display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--paper); }
  .stepper button{ width:32px; height:32px; border:none; background:transparent; color:var(--coffee-900); font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .stepper button:active{ background:var(--cream); }
  .stepper .qty{ min-width:26px; text-align:center; font-weight:700; font-size:0.92rem; }
  .stepper button.add-btn{ width:auto; padding:0 14px; background:var(--coffee-900); color:var(--cream); border-radius:999px; font-size:0.82rem; font-weight:600; }

  footer{ text-align:center; padding:30px 24px 20px; color:#9a8a7c; font-size:0.82rem; border-top:1px solid var(--line); max-width:640px; margin:0 auto; }
  footer strong{ color:var(--coffee-700); }

  /* Cart bar */
  .cart-bar{ position:fixed; left:0; right:0; bottom:0; bottom: calc(0px + env(safe-area-inset-bottom, 0px)); background:var(--coffee-900); color:var(--cream); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; transform:translateY(110%); transition:transform .25s ease; z-index:30; }
  .cart-bar.show{ transform:translateY(0); }
  .cart-bar .info{ font-size:0.9rem; }
  .cart-bar .info b{ font-size:1.02rem; }
  .cart-bar button{ background:var(--amber); color:var(--coffee-900); border:none; padding:10px 20px; border-radius:999px; font-weight:700; font-size:0.9rem; font-family:inherit; cursor:pointer; }

  /* Overlay */
  .overlay{ position:fixed; inset:0; background:rgba(43,27,18,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{ background:var(--paper); width:100%; max-width:640px; border-radius:20px 20px 0 0; padding:24px 24px calc(24px + env(safe-area-inset-bottom, 0px)); max-height:85vh; overflow-y:auto; transform:translateY(20px); transition:transform .25s ease; }
  .overlay.show .sheet{ transform:translateY(0); }
  .sheet h3{ margin:0 0 18px; font-size:1.3rem; font-weight:700; }
  .sheet .close{ position:absolute; left:20px; top:20px; background:none; border:none; font-size:1.4rem; color:var(--coffee-700); cursor:pointer; }
  .order-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); font-size:0.92rem; }
  .order-row .oq{ color:var(--olive); font-weight:600; margin-left:6px; }
  .order-total{ display:flex; justify-content:space-between; align-items:center; padding:16px 0 6px; font-size:1.05rem; font-weight:700; }
  .order-total span{ color:var(--amber); }
  label.field{ display:block; margin-top:18px; font-size:0.86rem; font-weight:600; color:var(--coffee-700); }
  input.field-input{ width:100%; margin-top:8px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:0.95rem; background:#fff; color:var(--coffee-900); }
  input.field-input:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .submit-order{ display:block; width:100%; margin-top:22px; padding:14px; background:var(--coffee-900); color:var(--cream); border:none; border-radius:12px; font-weight:700; font-size:1rem; font-family:inherit; cursor:pointer; text-align:center; text-decoration:none; box-sizing:border-box; }
  .submit-order:disabled{ opacity:0.5; cursor:not-allowed; }
  .err{ color:#B3452B; font-size:0.8rem; margin-top:6px; display:none; }

  .confirm{ text-align:center; padding:10px 0 6px; }
  .confirm .mark{ width:56px; height:56px; border-radius:50%; background:var(--olive); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin:0 auto 16px; }
  .confirm h3{ margin:0 0 8px; }
  .confirm p{ color:#6b5c4e; font-size:0.9rem; line-height:1.7; margin:0 0 18px; }
  .confirm .code{ font-weight:700; color:var(--amber); }

  /* Admin */
  .admin-btn{ position:fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left:14px; width:40px; height:40px; border-radius:50%; background:var(--coffee-900); color:var(--cream); border:none; font-size:1.1rem; z-index:40; display:none; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 10px rgba(43,27,18,0.3); }
  .admin-btn.visible{ display:flex; }
  .admin-cat{ margin-top:22px; }
  .admin-cat h4{ margin:0 0 10px; font-size:1rem; font-weight:700; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .admin-item{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); }
  .admin-item input{ font-family:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:0.85rem; background:#fff; color:var(--coffee-900); }
  .admin-item .a-name{ flex:1 1 140px; min-width:100px; }
  .admin-item .a-desc{ flex:2 1 200px; min-width:140px; }
  .admin-item .a-price{ width:80px; }
  .admin-item .a-remove{ background:none; border:none; color:#B3452B; font-size:0.8rem; cursor:pointer; padding:4px 6px; }
  .a-add-item{ margin-top:8px; background:none; border:1px dashed var(--line); color:var(--coffee-700); border-radius:8px; padding:8px 12px; font-size:0.82rem; cursor:pointer; font-family:inherit; }
  .admin-status{ font-size:0.82rem; margin-top:14px; min-height:1.2em; color:var(--olive); }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-mark"></div>
    <h1>هانی‌مون</h1>
    <p>منوی آنلاین — آیتم مورد نظرت رو انتخاب کن، تعداد رو تنظیم کن و سفارش رو ثبت کن.</p>
  </div>
</div>

<nav class="cat-nav">
  <a href="#hot">قهوه‌ی گرم</a>
  <a href="#cold">نوشیدنی سرد</a>
  <a href="#tea">دمنوش و چای</a>
  <a href="#dessert">دسر و کیک</a>
  <a href="#bites">میان‌وعده</a>
</nav>

<main id="menu"></main>

<footer>
  ساخته‌شده برای <strong>هانی‌مون</strong> — اسم، آیتم‌ها و قیمت‌ها نمونه‌ست و قابل ویرایشه.
</footer>

<div class="cart-bar" id="cartBar">
  <div class="info">سبد شما: <b id="cartCount">۰</b> آیتم — <b id="cartTotal">۰</b> هزار تومان</div>
  <button id="openOrder">مشاهده و ثبت سفارش</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<button class="admin-btn" id="adminBtn" title="ویرایش منو">⚙</button>
<div class="overlay" id="adminOverlay">
  <div class="sheet" id="adminSheet"></div>
</div>

<script>
const MENU = /*MENU_DATA_START*/{"hot":{"title":"قهوه‌ی گرم","en":"Hot Coffee","items":[{"id":"espresso","name":"اسپرسو","desc":"شات دبل از دان تازه‌آسیاب، عصاره‌ی غلیظ و معطر.","price":150},{"id":"americano","name":"آمریکانو","desc":"اسپرسو رقیق‌شده با آب گرم، طعمی ملایم‌تر.","price":55},{"id":"cappuccino","name":"کاپوچینو","desc":"اسپرسو با شیر بخاردیده و فوم ابری.","price":65},{"id":"latte","name":"لاته وانیل","desc":"لاته کلاسیک با شربت وانیل خانگی.","price":70}]},"cold":{"title":"نوشیدنی سرد","en":"Cold Drinks","items":[{"id":"iced-latte","name":"آیس لاته","desc":"اسپرسو، شیر سرد و یخ؛ ساده و خنک.","price":75},{"id":"cold-brew","name":"کلد برو","desc":"دم‌آوری سرد ۱۸ ساعته، تلخی ملایم.","price":85},{"id":"mojito","name":"موهیتو توت‌فرنگی","desc":"نعنا تازه، لیموترش و پوره‌ی توت‌فرنگی.","price":90}]},"tea":{"title":"دمنوش و چای","en":"Tea & Infusions","items":[{"id":"masala","name":"چای ماسالا","desc":"دم‌کرده با هل، دارچین و زنجبیل.","price":50},{"id":"flower","name":"دمنوش گل‌ها","desc":"ترکیب گل رز، بابونه و آویشن.","price":45}]},"dessert":{"title":"دسر و کیک","en":"Desserts","items":[{"id":"cheesecake","name":"چیزکیک کارامل نمکی","desc":"تهیه‌شده در کافه، سرو با سس کارامل.","price":88},{"id":"brownie","name":"براونی گردو","desc":"مغزدار و فادج، سرو گرم به‌سفارش.","price":75}]},"bites":{"title":"میان‌وعده","en":"Light Bites","items":[{"id":"croissant-sw","name":"ساندویچ کرواسان مرغ","desc":"مرغ گریل، سس مخصوص و سبزیجات تازه.","price":120},{"id":"avocado","name":"توست آووکادو","desc":"نان تست سبوس‌دار، آووکادو و تخم‌مرغ آب‌پز.","price":105}]}}/*MENU_DATA_END*/;

const cart = {};
const fa = n => n.toLocaleString('fa-IR');

function renderMenu(){
  const main = document.getElementById('menu');
  let html = '';
  for(const [catId, cat] of Object.entries(MENU)){
    html += `<section class="category" id="${catId}"><div class="cat-head"><h2>${cat.title}</h2><span>${cat.en}</span></div>`;
    for(const it of cat.items){
      html += `<div class="item">
        <div class="item-info">
          <p class="item-name">${it.name}</p>
          <p class="item-desc">${it.desc}</p>
          <p class="item-price">${fa(it.price)}<small>هزار تومان</small></p>
        </div>
        <div class="item-right">
          <div class="stepper" data-id="${it.id}">
            <button class="minus" aria-label="کم کردن">−</button>
            <span class="qty">۰</span>
            <button class="plus" aria-label="اضافه کردن">+</button>
          </div>
        </div>
      </div>`;
    }
    html += `</section>`;
  }
  main.innerHTML = html;
}

function allItems(){
  return Object.values(MENU).flatMap(c => c.items);
}

function updateStepperUI(id){
  const qty = cart[id] || 0;
  document.querySelectorAll(`.stepper[data-id="${id}"] .qty`).forEach(el => el.textContent = fa(qty));
}

function updateCartBar(){
  const bar = document.getElementById('cartBar');
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const total = allItems().reduce((sum,it)=> sum + (cart[it.id]||0)*it.price, 0);
  document.getElementById('cartCount').textContent = fa(count);
  document.getElementById('cartTotal').textContent = fa(total);
  bar.classList.toggle('show', count > 0);
}

function changeQty(id, delta){
  const cur = cart[id] || 0;
  const next = Math.max(0, cur + delta);
  if(next === 0) delete cart[id]; else cart[id] = next;
  updateStepperUI(id);
  updateCartBar();
}

document.getElementById('menu').addEventListener('click', e => {
  const stepper = e.target.closest('.stepper');
  if(!stepper) return;
  const id = stepper.dataset.id;
  if(e.target.classList.contains('plus')) changeQty(id, 1);
  if(e.target.classList.contains('minus')) changeQty(id, -1);
});

function openOrderSheet(){
  const items = allItems().filter(it => cart[it.id] > 0);
  const total = items.reduce((s,it)=> s + cart[it.id]*it.price, 0);
  let rows = items.map(it => `
    <div class="order-row">
      <span>${it.name} <span class="oq">× ${fa(cart[it.id])}</span></span>
      <span>${fa(cart[it.id]*it.price)} هزار</span>
    </div>`).join('');

  document.getElementById('sheet').innerHTML = `
    <button class="close" id="closeSheet">✕</button>
    <h3>بررسی سفارش</h3>
    ${rows}
    <div class="order-total"><span>مجموع</span><span>${fa(total)} هزار تومان</span></div>
    <label class="field" for="custName">اسم شما</label>
    <input class="field-input" id="custName" placeholder="مثلاً سارا محمدی">
    <div class="err" id="nameErr">لطفاً اسمت رو وارد کن.</div>
    <label class="field" for="custNote">توضیح اضافه (اختیاری)</label>
    <input class="field-input" id="custNote" placeholder="مثلاً بدون شکر">
    <button class="submit-order" id="submitOrder">ثبت سفارش</button>
  `;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('closeSheet').onclick = closeOverlay;
  document.getElementById('submitOrder').onclick = () => submitOrder(items, total);
}

function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
}

const ORDER_EMAIL = "Moj.elevator.co@gmail.com";
const TALLY_FORM_URL = "https://tally.so/r/VLgBLN";

function buildMailto(name, note, items, total, code){
  const lines = items.map(it => `${it.name} × ${cart[it.id]} = ${cart[it.id]*it.price} هزار تومان`).join('\n');
  const subject = `سفارش جدید هانی‌مون - کد #${code}`;
  const body =
`مشتری: ${name}
${note ? `توضیح: ${note}\n` : ''}
اقلام سفارش:
${lines}

مجموع: ${total} هزار تومان
کد پیگیری: #${code}`;
  return `mailto:${ORDER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function buildTallyUrl(name, note, items, total, code){
  const lines = items.map(it => `${it.name} x${cart[it.id]}`).join(' | ');
  const params = new URLSearchParams({
    cust_name: name,
    order_items: lines,
    order_total: String(total),
    order_code: String(code),
    order_note: note || ''
  });
  return `${TALLY_FORM_URL}?${params.toString()}`;
}

function submitOrder(items, total){
  const name = document.getElementById('custName').value.trim();
  if(!name){
    document.getElementById('nameErr').style.display = 'block';
    return;
  }
  const note = document.getElementById('custNote').value.trim();
  const code = Math.floor(1000 + Math.random()*9000);
  const mailtoLink = buildMailto(name, note, items, total, code);
  const tallyLink = buildTallyUrl(name, note, items, total, code);

  document.getElementById('sheet').innerHTML = `
    <button class="close" id="closeSheet">✕</button>
    <div class="confirm">
      <div class="mark">✓</div>
      <h3>یک قدم تا ثبت سفارش</h3>
      <p>${name} عزیز، خلاصه‌ی سفارشت با کد <span class="code">#${code}</span> آماده‌ست.<br>
      مجموع: <b>${fa(total)} هزار تومان</b>${note ? `<br>توضیح: ${note}` : ''}</p>
      <p style="font-size:0.8rem;">یکی از دو راه زیر رو بزن تا سفارش برای کافه ارسال بشه.</p>
      <a class="submit-order" href="${tallyLink}" target="_blank" rel="noopener">باز کردن فرم سفارش</a>
      <a class="submit-order" href="${mailtoLink}" style="background:transparent;color:var(--coffee-900);border:1px solid var(--line);margin-top:10px;">یا ارسال با ایمیل</a>
      <button class="submit-order" id="newOrder" style="background:transparent;color:var(--olive);border:none;margin-top:6px;font-size:0.85rem;">سفارش جدید</button>
    </div>
  `;

  document.getElementById('closeSheet').onclick = () => { closeOverlay(); resetCart(); };
  document.getElementById('newOrder').onclick = () => { closeOverlay(); resetCart(); };
}

function resetCart(){
  Object.keys(cart).forEach(id => delete cart[id]);
  allItems().forEach(it => updateStepperUI(it.id));
  updateCartBar();
}

document.getElementById('overlay').addEventListener('click', e => {
  if(e.target.id === 'overlay') closeOverlay();
});
document.getElementById('openOrder').addEventListener('click', openOrderSheet);

/* ---------- Admin (menu editing) ---------- */
let artifactCap = null;
let adminDraft = null;

async function initAdmin(){
  try{
    artifactCap = await claude.use('artifact');
  }catch(e){ artifactCap = null; }
  if(artifactCap){
    document.getElementById('adminBtn').classList.add('visible');
  }
}

function slugify(str){
  return 'item-' + Math.random().toString(36).slice(2,8);
}

function openAdminSheet(){
  adminDraft = JSON.parse(JSON.stringify(MENU)); // deep clone for editing
  renderAdminSheet();
  document.getElementById('adminOverlay').classList.add('show');
}

function closeAdminOverlay(){
  document.getElementById('adminOverlay').classList.remove('show');
}

function renderAdminSheet(){
  let html = `<button class="close" id="adminClose">✕</button><h3>ویرایش منو</h3>`;
  for(const [catId, cat] of Object.entries(adminDraft)){
    html += `<div class="admin-cat" data-cat="${catId}"><h4>${cat.title}</h4>`;
    for(const it of cat.items){
      html += `<div class="admin-item" data-id="${it.id}">
        <input class="a-name" value="${it.name.replace(/"/g,'&quot;')}" placeholder="اسم">
        <input class="a-desc" value="${it.desc.replace(/"/g,'&quot;')}" placeholder="توضیح">
        <input class="a-price" type="number" value="${it.price}" placeholder="قیمت">
        <button class="a-remove" data-cat="${catId}" data-id="${it.id}">حذف</button>
      </div>`;
    }
    html += `<button class="a-add-item" data-cat="${catId}">+ آیتم جدید</button></div>`;
  }
  html += `<button class="submit-order" id="adminSave">ذخیره و انتشار برای همه</button>
    <div class="admin-status" id="adminStatus"></div>`;
  document.getElementById('adminSheet').innerHTML = html;

  document.getElementById('adminClose').onclick = closeAdminOverlay;

  document.querySelectorAll('.a-remove').forEach(btn => {
    btn.onclick = () => {
      const cat = adminDraft[btn.dataset.cat];
      cat.items = cat.items.filter(it => it.id !== btn.dataset.id);
      readAdminInputsIntoDraft();
      renderAdminSheet();
    };
  });
  document.querySelectorAll('.a-add-item').forEach(btn => {
    btn.onclick = () => {
      readAdminInputsIntoDraft();
      adminDraft[btn.dataset.cat].items.push({id:slugify(), name:"آیتم جدید", desc:"", price:0});
      renderAdminSheet();
    };
  });
  document.getElementById('adminSave').onclick = saveAdminChanges;
}

function readAdminInputsIntoDraft(){
  document.querySelectorAll('.admin-cat').forEach(catEl => {
    const catId = catEl.dataset.cat;
    const rows = catEl.querySelectorAll('.admin-item');
    const items = [];
    rows.forEach(row => {
      items.push({
        id: row.dataset.id,
        name: row.querySelector('.a-name').value.trim() || 'بدون‌نام',
        desc: row.querySelector('.a-desc').value.trim(),
        price: Number(row.querySelector('.a-price').value) || 0
      });
    });
    adminDraft[catId].items = items;
  });
}

async function saveAdminChanges(){
  readAdminInputsIntoDraft();
  const statusEl = document.getElementById('adminStatus');
  statusEl.textContent = 'در حال انتشار...';

  // Build the full new HTML document from the current DOM, with fresh MENU data
  const overlay1 = document.getElementById('overlay');
  const overlay2 = document.getElementById('adminOverlay');
  const wasShow1 = overlay1.classList.contains('show');
  const wasShow2 = overlay2.classList.contains('show');
  overlay1.classList.remove('show');
  overlay2.classList.remove('show');
  document.getElementById('cartBar').classList.remove('show');

  const menuJson = JSON.stringify(adminDraft);
  let fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  fullHtml = fullHtml.replace(/\/\*MENU_DATA_START\*\/[\s\S]*?\/\*MENU_DATA_END\*\//, `/*MENU_DATA_START*/${menuJson}/*MENU_DATA_END*/`);

  try{
    const result = await artifactCap.publish(fullHtml);
    statusEl.textContent = 'ذخیره شد؛ منو برای همه به‌روزرسانی شد.';
  }catch(err){
    if(err && err.code === 'conflict'){
      statusEl.textContent = 'یه نسخه‌ی جدیدتر منتشر شده؛ صفحه رو رفرش کن و دوباره امتحان کن.';
    }else{
      statusEl.textContent = 'ذخیره نشد. دوباره امتحان کن.';
    }
  }
  if(wasShow1) overlay1.classList.add('show');
  if(wasShow2) overlay2.classList.add('show');
}

document.getElementById('adminBtn').addEventListener('click', openAdminSheet);
document.getElementById('adminOverlay').addEventListener('click', e => {
  if(e.target.id === 'adminOverlay') closeAdminOverlay();
});

initAdmin();
renderMenu();
</script>
